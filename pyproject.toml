[build-system]
requires = ["setuptools>=45", "wheel", "mypy>=1.14,<2", "rdkit"]
build-backend = "setuptools.build_meta"
 
[project]
name = "rdchiral_plus"
version = "0.6.0"
description = "Wrapper for RDKit's RunReactants to improve stereochemistry handling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rdkit",
    "loguru",
]
authors = [
    {name = "Connor Coley", email = "ccoley@mit.edu"},
    {name = "Carson Britt", email = "carson.s.britt@gmail.com"}
]
maintainers = [
    {name = "Carson Britt", email = "carson.s.britt@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/denovochem/rdchiral_plus/"
Repository = "https://github.com/denovochem/rdchiral_plus/"
Issues = "https://github.com/denovochem/rdchiral_plus/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["rdchiral*"]


[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "mypy>=1.14.1",
    "pandas>=2.3.3",
    "pytest>=8.3.5",
    "rdcanon>=0.1.2",
    "ruff>=0.15.6",
]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rdkit.*"
follow_imports = "skip"

[tool.ruff.lint]
ignore = ["UP", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"scripts/speed_benchmark_script.py" = ["E402"]
"tests/unit/test_benchmark_utils.py" = ["E402"]
"examples/*.ipynb" = ["E402"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
markers = [
    "slow: integration/performance-style tests",
]
